name: Code Quality

on:
  push:
    branches: [ "master", "main", "claude/**" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  android-lint:
    name: Android Lint Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Android Lint
      run: ./gradlew lintDebug --no-daemon
      continue-on-error: true

    - name: Upload Lint Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-lint-report
        path: app/build/reports/lint-results-debug.html

    - name: Analyze Lint Results
      if: always()
      run: |
        if [ -f "app/build/reports/lint-results-debug.xml" ]; then
          echo "=== Lint Results Summary ==="
          cat app/build/reports/lint-results-debug.xml | grep -o 'severity="[^"]*"' | sort | uniq -c || true
        fi

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  cpp-security:
    name: C++ Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-tidy

    - name: Run security-focused cppcheck
      run: |
        echo "=== Running C++ Security Analysis ==="
        cppcheck --enable=warning,style,performance,portability,information \
          --suppress=missingIncludeSystem \
          --std=c++11 \
          --template='{file}:{line}: {severity}: {message} [{id}]' \
          app/src/main/cpp/ 2>&1 | tee cppcheck-security.txt || true

    - name: Check for common vulnerabilities
      run: |
        echo "=== Checking for common C++ vulnerabilities ==="

        # Buffer overflow risks
        echo "Checking for strcpy/strcat usage..."
        grep -rn "strcpy\|strcat\|sprintf" app/src/main/cpp/ || echo "✓ No unsafe string functions found"

        # Memory leaks
        echo "Checking for malloc without free..."
        grep -rn "malloc\|calloc" app/src/main/cpp/ || echo "✓ No explicit malloc found"

        # NULL pointer checks
        echo "Checking for potential NULL dereference..."
        grep -rn "NULL ==" app/src/main/cpp/ || true

        # Use after free
        echo "Checking for close/free patterns..."
        grep -A5 "close\|free" app/src/main/cpp/ || true

    - name: Upload security analysis
      uses: actions/upload-artifact@v4
      with:
        name: cpp-security-analysis
        path: cppcheck-security.txt

  java-security:
    name: Java Security Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for security issues
      run: |
        echo "=== Java Security Analysis ==="

        # Check for SQL injection risks
        echo "Checking for SQL injection risks..."
        grep -rn "execSQL\|rawQuery" app/src/main/java/ || echo "✓ No raw SQL found"

        # Check for hardcoded secrets
        echo "Checking for hardcoded secrets..."
        grep -rni "password\|secret\|api_key\|token" app/src/main/java/ --include="*.java" | grep -v "// " || echo "✓ No obvious secrets"

        # Check for insecure random
        echo "Checking for insecure random usage..."
        grep -rn "java.util.Random" app/src/main/java/ || echo "✓ No insecure Random usage"

        # Check for command injection
        echo "Checking for command execution..."
        grep -rn "Runtime.getRuntime().exec\|ProcessBuilder" app/src/main/java/ || echo "Found command execution"

        # Check for path traversal
        echo "Checking for file operations..."
        grep -rn "new File\|FileInputStream\|FileOutputStream" app/src/main/java/ || echo "Found file operations"

    - name: Generate security report
      run: |
        {
          echo "# Security Analysis Report"
          echo "Generated: $(date)"
          echo ""
          echo "## Findings"
          echo "See individual check outputs above"
        } > security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
