name: Android CI

on:
  push:
    branches: [ "master", "main", "claude/**" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build with Gradle
      run: ./gradlew build --stacktrace --no-daemon

    - name: Run Lint checks
      run: ./gradlew lint --stacktrace --no-daemon
      continue-on-error: true

    - name: Upload Lint results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: lint-results
        path: app/build/reports/lint-results*.html

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease --stacktrace --no-daemon
      continue-on-error: true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-reports
        path: |
          app/build/reports/
          app/build/outputs/

  cpp-analysis:
    name: C++ Code Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cppcheck
      run: sudo apt-get update && sudo apt-get install -y cppcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=all --inconclusive --xml --xml-version=2 \
          app/src/main/cpp/ 2> cppcheck-result.xml || true

    - name: Display cppcheck results
      run: |
        echo "=== C++ Static Analysis Results ==="
        cppcheck --enable=warning,style,performance,portability \
          app/src/main/cpp/ 2>&1 | tee cppcheck-output.txt || true

    - name: Upload cppcheck results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: cppcheck-results
        path: |
          cppcheck-result.xml
          cppcheck-output.txt

  verify-native-build:
    name: Verify Native Libraries Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      run: |
        echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build native libraries
      run: ./gradlew externalNativeBuild --stacktrace --no-daemon

    - name: Verify native binaries
      run: |
        echo "=== Checking for native libraries ==="
        find app/build -name "*.so" -o -name "virtualMouse" | head -20

    - name: Upload native build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: native-libraries
        path: app/build/intermediates/cmake/

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check for dependency updates
      run: ./gradlew dependencies --no-daemon > dependencies.txt || true

    - name: Upload dependency tree
      uses: actions/upload-artifact@v3
      with:
        name: dependencies
        path: dependencies.txt
